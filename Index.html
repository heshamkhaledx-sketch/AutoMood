<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Auto Mood Car Care</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #ff7a00;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card,
    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }

    .section {
      margin-bottom: 20px;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
      color: #ff7a00;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      background: #ff7a00;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    th {
      background: #111;
      color: white;
    }

    .success,
    .error {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .success {
      background: #e8f8ee;
      color: #187a3d;
    }

    .error {
      background: #ffe8e8;
      color: #b00020;
    }

    @media (max-width: 600px) {
      .container {
        padding: 8px;
      }

      table {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>AUTO MOOD</h1>
  <p>Car Care Management System</p>
</header>

<div class="container">

  <div id="message"></div>

  <div class="cards">
    <div class="card">
      <h3>فواتير اليوم</h3>
      <div class="number" id="invoiceCount">0</div>
    </div>

    <div class="card">
      <h3>مبيعات اليوم</h3>
      <div class="number" id="salesTotal">0</div>
      <small>جنيه</small>
    </div>

    <div class="card">
      <h3>مصروفات اليوم</h3>
      <div class="number" id="expenseTotal">0</div>
      <small>جنيه</small>
    </div>

    <div class="card">
      <h3>صافي اليوم</h3>
      <div class="number" id="netTotal">0</div>
      <small>جنيه</small>
    </div>
  </div>


  <div class="section">

    <h2>🧾 فاتورة جديدة</h2>

    <label>رقم تليفون العميل</label>
    <input type="tel" id="phone" placeholder="01xxxxxxxxx">

    <label>نوع الغسيل</label>
    <select id="service">
      <option value="غسيل عادي|130">غسيل عادي - 130 جنيه</option>
      <option value="غسيل كيماوي|250">غسيل كيماوي - 250 جنيه</option>
      <option value="غسيل كامل|150">غسيل كامل - 150 جنيه</option>
      <option value="تلميع|200">تلميع - 200 جنيه</option>
    </select>

    <label>إضافة</label>
    <select id="product">
      <option value="0">بدون إضافة</option>
      <option value="فواحة|50">فواحة - 50 جنيه</option>
      <option value="ملمع تابلوه|50">ملمع تابلوه - 50 جنيه</option>
      <option value="معطر|60">معطر - 60 جنيه</option>
    </select>

    <button onclick="createInvoice()">حفظ الفاتورة</button>

  </div>


  <div class="section">

    <h2>👤 سجل العميل</h2>

    <input type="tel" id="searchPhone" placeholder="اكتب رقم تليفون العميل">

    <button onclick="searchCustomer()">بحث</button>

    <div id="customerResult"></div>

  </div>


  <div class="section">

    <h2>💰 إضافة مصروف</h2>

    <input type="text" id="expenseName" placeholder="اسم المصروف">

    <input type="number" id="expenseAmount" placeholder="المبلغ">

    <button onclick="addExpense()">إضافة المصروف</button>

  </div>


  <div class="section">

    <h2>📋 آخر الفواتير</h2>

    <table>
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>التليفون</th>
          <th>الخدمة</th>
          <th>الإضافة</th>
          <th>الإجمالي</th>
        </tr>
      </thead>

      <tbody id="invoiceTable"></tbody>
    </table>

  </div>


  <div class="section">

    <h2>📊 آخر المصروفات</h2>

    <table>
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>المصروف</th>
          <th>المبلغ</th>
        </tr>
      </thead>

      <tbody id="expenseTable"></tbody>
    </table>

  </div>

</div>


<script>

const API_URL =
  "https://script.google.com/macros/s/AKfycbzNoSKZeYqTSWBNeJeCM1PK90i8Q3Vx0xXEiwMDmoiaKzHxupT92OfzJUAKivP5EqE3Ew/exec";


function showMessage(text, type = "success") {

  document.getElementById("message").innerHTML =
    `<div class="${type}">${text}</div>`;

  setTimeout(() => {
    document.getElementById("message").innerHTML = "";
  }, 4000);

}


async function api(action, data = {}) {

  const url =
    new URL(API_URL);

  url.searchParams.set(
    "action",
    action
  );

  Object.keys(data).forEach(key => {
    url.searchParams.set(
      key,
      data[key]
    );
  });

  const response =
    await fetch(url.toString());

  return response.json();

}


async function createInvoice() {

  try {

    const phone =
      document.getElementById("phone").value.trim();

    if (!phone) {
      showMessage(
        "من فضلك اكتب رقم تليفون العميل",
        "error"
      );
      return;
    }


    const service =
      document.getElementById("service").value.split("|");

    const product =
      document.getElementById("product").value.split("|");


    const result =
      await api(
        "createInvoice",
        {
          phone: phone,

          service: service[0],

          servicePrice: service[1],

          product:
            product.length > 1
              ? product[0]
              : "بدون إضافة",

          productPrice:
            product.length > 1
              ? product[1]
              : 0
        }
      );


    if (!result.success) {
      throw new Error(result.message);
    }


    document.getElementById("phone").value = "";

    showMessage(
      "تم حفظ الفاتورة بنجاح ✅"
    );

    loadAll();

  }

  catch (error) {

    console.error(error);

    showMessage(
      error.message ||
      "حدث خطأ أثناء حفظ الفاتورة",
      "error"
    );

  }

}


async function addExpense() {

  try {

    const name =
      document.getElementById("expenseName").value.trim();

    const amount =
      document.getElementById("expenseAmount").value;


    const result =
      await api(
        "addExpense",
        {
          name: name,
          amount: amount
        }
      );


    if (!result.success) {
      throw new Error(result.message);
    }


    document.getElementById("expenseName").value = "";
    document.getElementById("expenseAmount").value = "";

    showMessage(
      "تم إضافة المصروف بنجاح ✅"
    );

    loadAll();

  }

  catch (error) {

    showMessage(
      error.message ||
      "حدث خطأ",
      "error"
    );

  }

}


async function searchCustomer() {

  try {

    const phone =
      document.getElementById("searchPhone").value.trim();


    if (!phone) {
      showMessage(
        "اكتب رقم التليفون",
        "error"
      );
      return;
    }


    const result =
      await api(
        "getCustomerHistory",
        {
          phone: phone
        }
      );


    const data =
      result.data || [];


    const box =
      document.getElementById("customerResult");


    if (!data.length) {

      box.innerHTML =
        "<p>لا يوجد سجل لهذا العميل.</p>";

      return;

    }


    const total =
      data.reduce(
        (sum, item) =>
          sum + Number(item.total || 0),
        0
      );


    let html = `
      <h3>عدد الزيارات: ${data.length}</h3>
      <p>
        إجمالي المدفوع:
        <strong>${total} جنيه</strong>
      </p>

      <table>
        <tr>
          <th>التاريخ</th>
          <th>الخدمة</th>
          <th>الإضافة</th>
          <th>الإجمالي</th>
        </tr>
    `;


    data.forEach(item => {

      html += `
        <tr>
          <td>
            ${formatDate(item.date)}
          </td>

          <td>
            ${item.service || "-"}
          </td>

          <td>
            ${item.product || "-"}
          </td>

          <td>
            ${item.total} جنيه
          </td>
        </tr>
      `;

    });


    html += "</table>";

    box.innerHTML = html;

  }

  catch (error) {

    showMessage(
      "حدث خطأ أثناء البحث",
      "error"
    );

  }

}


async function loadDashboard() {

  const result =
    await api("getDashboard");

  if (!result.success) return;

  const data =
    result.data;


  document.getElementById("invoiceCount").innerText =
    data.invoiceCount || 0;

  document.getElementById("salesTotal").innerText =
    data.sales || 0;

  document.getElementById("expenseTotal").innerText =
    data.expenses || 0;

  document.getElementById("netTotal").innerText =
    data.net || 0;

}


async function loadInvoices() {

  const result =
    await api("getInvoices");

  if (!result.success) return;

  const table =
    document.getElementById("invoiceTable");

  table.innerHTML = "";


  (result.data || []).slice(0, 50).forEach(item => {

    table.innerHTML += `
      <tr>
        <td>${formatDate(item.date)}</td>
        <td>${item.phone || ""}</td>
        <td>${item.service || ""}</td>
        <td>${item.product || ""}</td>
        <td>${item.total || 0} جنيه</td>
      </tr>
    `;

  });

}


async function loadExpenses() {

  const result =
    await api("getExpenses");

  if (!result.success) return;

  const table =
    document.getElementById("expenseTable");

  table.innerHTML = "";


  (result.data || []).slice(0, 50).forEach(item => {

    table.innerHTML += `
      <tr>
        <td>${formatDate(item.date)}</td>
        <td>${item.name || ""}</td>
        <td>${item.amount || 0} جنيه</td>
      </tr>
    `;

  });

}


function formatDate(value) {

  if (!value) return "";

  try {
    return new Date(value).toLocaleString(
      "ar-EG"
    );
  }
  catch (error) {
    return value;
  }

}


async function loadAll() {

  try {

    await Promise.all([
      loadDashboard(),
      loadInvoices(),
      loadExpenses()
    ]);

  }

  catch (error) {

    console.error(error);

  }

}


loadAll();

</script>

</body>
</html>
