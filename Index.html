<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Auto Mood Car Care</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #ff7a00;
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 15px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
      text-align: center;
    }

    .card h3 {
      margin-top: 0;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
      color: #ff7a00;
    }

    .section {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #0001;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
    }

    button {
      background: #ff7a00;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #e66c00;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      border-bottom: 1px solid #eee;
      padding: 12px;
      text-align: center;
    }

    th {
      background: #111;
      color: white;
    }

    .danger {
      background: #d63031;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    @media(max-width:600px) {
      table {
        font-size: 13px;
      }

      .container {
        padding: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>AUTO MOOD</h1>
  <p>Car Care Management System</p>
</header>

<div class="container">

  <!-- Dashboard -->

  <div class="cards">

    <div class="card">
      <h3>إجمالي الفواتير</h3>
      <div class="number" id="invoiceCount">0</div>
    </div>

    <div class="card">
      <h3>إجمالي المبيعات</h3>
      <div class="number" id="salesTotal">0</div>
      <small>جنيه</small>
    </div>

    <div class="card">
      <h3>المصروفات</h3>
      <div class="number" id="expenseTotal">0</div>
      <small>جنيه</small>
    </div>

    <div class="card">
      <h3>صافي اليوم</h3>
      <div class="number" id="netTotal">0</div>
      <small>جنيه</small>
    </div>

  </div>


  <!-- فاتورة جديدة -->

  <div class="section">

    <h2>🧾 فاتورة جديدة</h2>

    <label>رقم تليفون العميل</label>

    <input
      type="tel"
      id="phone"
      placeholder="01xxxxxxxxx"
    >

    <label>نوع الغسيل</label>

    <select id="service">

      <option value="غسيل عادي|130">
        غسيل عادي - 130 جنيه
      </option>

      <option value="غسيل كيماوي|250">
        غسيل كيماوي - 250 جنيه
      </option>

      <option value="غسيل كامل|150">
        غسيل كامل - 150 جنيه
      </option>

      <option value="تلميع|200">
        تلميع - 200 جنيه
      </option>

    </select>

    <label>منتج / إضافة</label>

    <select id="product">

      <option value="0">
        بدون إضافة
      </option>

      <option value="فواحة|50">
        فواحة - 50 جنيه
      </option>

      <option value="ملمع تابلوه|50">
        ملمع تابلوه - 50 جنيه
      </option>

      <option value="معطر|60">
        معطر - 60 جنيه
      </option>

    </select>

    <button onclick="createInvoice()">
      حفظ الفاتورة
    </button>

  </div>


  <!-- البحث عن العميل -->

  <div class="section">

    <h2>👤 سجل العميل</h2>

    <input
      type="tel"
      id="searchPhone"
      placeholder="اكتب رقم تليفون العميل"
    >

    <button onclick="searchCustomer()">
      بحث
    </button>

    <div id="customerResult"></div>

  </div>


  <!-- المصروفات -->

  <div class="section">

    <h2>💰 إضافة مصروف</h2>

    <input
      type="text"
      id="expenseName"
      placeholder="مثال: كهرباء"
    >

    <input
      type="number"
      id="expenseAmount"
      placeholder="المبلغ"
    >

    <button onclick="addExpense()">
      إضافة المصروف
    </button>

  </div>


  <!-- الفواتير -->

  <div class="section">

    <h2>📋 الفواتير</h2>

    <table>

      <thead>

        <tr>
          <th>التاريخ</th>
          <th>التليفون</th>
          <th>الخدمة</th>
          <th>الإضافة</th>
          <th>الإجمالي</th>
        </tr>

      </thead>

      <tbody id="invoiceTable"></tbody>

    </table>

  </div>


  <!-- المصروفات -->

  <div class="section">

    <h2>📊 المصروفات</h2>

    <table>

      <thead>

        <tr>
          <th>التاريخ</th>
          <th>المصروف</th>
          <th>المبلغ</th>
        </tr>

      </thead>

      <tbody id="expenseTable"></tbody>

    </table>

  </div>

</div>


<script>

  let invoices =
    JSON.parse(localStorage.getItem("automood_invoices")) || [];

  let expenses =
    JSON.parse(localStorage.getItem("automood_expenses")) || [];


  function saveData() {

    localStorage.setItem(
      "automood_invoices",
      JSON.stringify(invoices)
    );

    localStorage.setItem(
      "automood_expenses",
      JSON.stringify(expenses)
    );

  }


  function createInvoice() {

    const phone =
      document.getElementById("phone").value.trim();

    if (!phone) {

      alert("من فضلك اكتب رقم تليفون العميل");

      return;

    }


    const serviceValue =
      document.getElementById("service").value.split("|");

    const serviceName = serviceValue[0];

    const servicePrice =
      Number(serviceValue[1]);


    const productValue =
      document.getElementById("product").value.split("|");

    let productName = "بدون إضافة";

    let productPrice = 0;


    if (productValue.length > 1) {

      productName = productValue[0];

      productPrice = Number(productValue[1]);

    }


    const total =
      servicePrice + productPrice;


    const invoice = {

      id: Date.now(),

      date: new Date().toLocaleString("ar-EG"),

      phone,

      service: serviceName,

      servicePrice,

      product: productName,

      productPrice,

      total

    };


    invoices.push(invoice);

    saveData();

    document.getElementById("phone").value = "";

    render();

    alert("تم حفظ الفاتورة بنجاح");

  }


  function addExpense() {

    const name =
      document.getElementById("expenseName").value.trim();

    const amount =
      Number(document.getElementById("expenseAmount").value);


    if (!name || !amount) {

      alert("اكتب اسم المصروف والمبلغ");

      return;

    }


    expenses.push({

      id: Date.now(),

      date: new Date().toLocaleString("ar-EG"),

      name,

      amount

    });


    saveData();

    document.getElementById("expenseName").value = "";

    document.getElementById("expenseAmount").value = "";

    render();

    alert("تم إضافة المصروف");

  }


  function searchCustomer() {

    const phone =
      document.getElementById("searchPhone").value.trim();


    const results =
      invoices.filter(invoice => invoice.phone === phone);


    const box =
      document.getElementById("customerResult");


    if (results.length === 0) {

      box.innerHTML =
        "<p>لا يوجد سجل لهذا الرقم.</p>";

      return;

    }


    let total = 0;

    results.forEach(item => {
      total += item.total;
    });


    let html = `

      <h3>عدد الزيارات: ${results.length}</h3>

      <p>
        إجمالي المدفوع:
        <strong>${total} جنيه</strong>
      </p>

      <table>

        <tr>
          <th>التاريخ</th>
          <th>الخدمة</th>
          <th>الإضافة</th>
          <th>الإجمالي</th>
        </tr>

    `;


    results.forEach(item => {

      html += `

        <tr>

          <td>${item.date}</td>

          <td>${item.service}</td>

          <td>${item.product}</td>

          <td>${item.total} جنيه</td>

        </tr>

      `;

    });


    html += "</table>";

    box.innerHTML = html;

  }


  function render() {

    const invoiceTable =
      document.getElementById("invoiceTable");

    const expenseTable =
      document.getElementById("expenseTable");


    invoiceTable.innerHTML = "";

    expenseTable.innerHTML = "";


    let sales = 0;

    let expenseTotal = 0;


    invoices.forEach(invoice => {

      sales += invoice.total;


      invoiceTable.innerHTML += `

        <tr>

          <td>${invoice.date}</td>

          <td>${invoice.phone}</td>

          <td>${invoice.service}</td>

          <td>${invoice.product}</td>

          <td>${invoice.total} جنيه</td>

        </tr>

      `;

    });


    expenses.forEach(expense => {

      expenseTotal += expense.amount;


      expenseTable.innerHTML += `

        <tr>

          <td>${expense.date}</td>

          <td>${expense.name}</td>

          <td>${expense.amount} جنيه</td>

        </tr>

      `;

    });


    document.getElementById("invoiceCount")
      .innerText = invoices.length;


    document.getElementById("salesTotal")
      .innerText = sales;


    document.getElementById("expenseTotal")
      .innerText = expenseTotal;


    document.getElementById("netTotal")
      .innerText = sales - expenseTotal;

  }


  render();

</script>

</body>
</html>
