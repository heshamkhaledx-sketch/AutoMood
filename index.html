<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUTO MOOD</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f4f5f7;
  color:#222;
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#111;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:400px;
  background:white;
  padding:35px 25px;
  border-radius:18px;
  box-shadow:0 10px 40px #0005;
  text-align:center;
}

.login-logo{
  font-size:38px;
  font-weight:bold;
  color:#ff7a00;
  margin-bottom:5px;
}

.login-subtitle{
  color:#777;
  margin-bottom:25px;
}

.login-box input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:18px;
  text-align:center;
  margin-bottom:15px;
}

.login-box button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#ff7a00;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.login-box button:hover{
  background:#e66c00;
}

.login-error{
  color:#c00;
  margin-top:15px;
  display:none;
}

/* SYSTEM */

#system{
  display:none;
}

header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  color:#ff7a00;
  font-size:32px;
}

header p{
  margin-bottom:0;
  color:#ddd;
}

.container{
  max-width:1200px;
  margin:25px auto;
  padding:15px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:25px 20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
  text-align:center;
}

.number{
  font-size:32px;
  font-weight:bold;
  color:#ff7a00;
  margin:12px 0;
}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:18px;
}

.menu-button{
  background:white;
  border:0;
  border-radius:14px;
  padding:30px 20px;
  box-shadow:0 2px 10px #0002;
  cursor:pointer;
}

.menu-icon{
  font-size:42px;
  margin-bottom:10px;
}

.menu-title{
  font-size:20px;
  font-weight:bold;
  color:#ff7a00;
}

.menu-desc{
  color:#777;
  margin-top:8px;
}

@media(max-width:600px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .menu{
    grid-template-columns:repeat(2,1fr);
  }

  .menu-button{
    padding:20px 10px;
  }

  .menu-title{
    font-size:16px;
  }

}

</style>

</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginScreen">

  <div class="login-box">

    <div class="login-logo">
      AUTO MOOD
    </div>

    <div class="login-subtitle">
      Car Care Management System
    </div>

    <input
      type="password"
      id="passwordInput"
      placeholder="اكتب كلمة المرور"
      autocomplete="off"
    >

    <button onclick="login()">
      دخول
    </button>

    <div
      id="loginError"
      class="login-error"
    >
      كلمة المرور غير صحيحة
    </div>

  </div>

</div>


<!-- ================= SYSTEM ================= -->

<div id="system">

<header>

  <h1>AUTO MOOD</h1>

  <p>
    Car Care Management System
  </p>

</header>


<div class="container">

<div id="message"></div>


<!-- ================= HOME ================= -->

<div
  id="homePage"
  class="page active"
>

  <div class="cards">

    <div class="card">
      <h3>فواتير اليوم</h3>

      <div
        class="number"
        id="invoiceCount"
      >
        0
      </div>

      <small>فاتورة</small>
    </div>


    <div class="card">
      <h3>مبيعات اليوم</h3>

      <div
        class="number"
        id="salesTotal"
      >
        0
      </div>

      <small>جنيه</small>
    </div>


    <div class="card">
      <h3>مصروفات اليوم</h3>

      <div
        class="number"
        id="expenseTotal"
      >
        0
      </div>

      <small>جنيه</small>
    </div>


    <div class="card">
      <h3>صافي اليوم</h3>

      <div
        class="number"
        id="netTotal"
      >
        0
      </div>

      <small>جنيه</small>
    </div>

  </div>


  <div class="menu">

    <button
      class="menu-button"
      onclick="openPage('invoicePage')"
    >
      <div class="menu-icon">🧾</div>
      <div class="menu-title">
        فاتورة جديدة
      </div>
      <div class="menu-desc">
        إنشاء فاتورة للعميل
      </div>
    </button>


    <button
      class="menu-button"
      onclick="openSalesPage()"
    >
      <div class="menu-icon">📊</div>
      <div class="menu-title">
        المبيعات
      </div>
      <div class="menu-desc">
        فواتير ومبيعات اليوم
      </div>
    </button>


    <button
      class="menu-button"
      onclick="openExpensesPage()"
    >
      <div class="menu-icon">💰</div>
      <div class="menu-title">
        المصروفات
      </div>
      <div class="menu-desc">
        تسجيل المصروفات
      </div>
    </button>


    <button
      class="menu-button"
      onclick="openPage('customersPage')"
    >
      <div class="menu-icon">👤</div>
      <div class="menu-title">
        العملاء
      </div>
      <div class="menu-desc">
        سجل العميل
      </div>
    </button>


    <button
      class="menu-button"
      onclick="openReportsPage()"
    >
      <div class="menu-icon">📈</div>
      <div class="menu-title">
        التقارير
      </div>
      <div class="menu-desc">
        تقارير النظام
      </div>
    </button>


    <button
      class="menu-button"
      onclick="openPage('suppliersPage')"
    >
      <div class="menu-icon">🏪</div>
      <div class="menu-title">
        الموردين
      </div>
      <div class="menu-desc">
        الموردين والحسابات
      </div>
    </button>


    <button
      class="menu-button"
      onclick="openPage('warehousePage')"
    >
      <div class="menu-icon">📦</div>
      <div class="menu-title">
        المخزن
      </div>
      <div class="menu-desc">
        إدارة المنتجات والمخزون
      </div>
    </button>


    <button
      class="menu-button"
      onclick="openPage('purchasesPage')"
    >
      <div class="menu-icon">🛒</div>
      <div class="menu-title">
        المشتريات
      </div>
      <div class="menu-desc">
        شراء منتجات من الموردين
      </div>
    </button>


    <button
      class="menu-button"
      onclick="finishDay()"
    >
      <div class="menu-icon">🔒</div>
      <div class="menu-title">
        إنهاء اليوم
      </div>
      <div class="menu-desc">
        إغلاق اليوم وبدء يوم جديد
      </div>
    </button>


    <button
      class="menu-button"
      onclick="logout()"
    >
      <div class="menu-icon">🚪</div>
      <div class="menu-title">
        تسجيل خروج
      </div>
      <div class="menu-desc">
        الخروج من النظام
      </div>
    </button>

  </div>

</div>


<!-- الصفحات الأخرى سنضيفها في الجزء التالي -->


</div>

</div>


<script>

/* ================= PASSWORD ================= */

const SYSTEM_PASSWORD = "automood26";


function login(){

  const password =
    document
      .getElementById("passwordInput")
      .value;

  if(password === SYSTEM_PASSWORD){

    document
      .getElementById("loginScreen")
      .style.display = "none";

    document
      .getElementById("system")
      .style.display = "block";

    sessionStorage.setItem(
      "autoMoodLoggedIn",
      "true"
    );

    loadDashboard();

  }else{

    document
      .getElementById("loginError")
      .style.display = "block";

  }

}


function logout(){

  sessionStorage.removeItem(
    "autoMoodLoggedIn"
  );

  location.reload();

}


/* ENTER */

document
  .getElementById("passwordInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        login();
      }

    }
  );


/* CHECK LOGIN */

if(
  sessionStorage.getItem(
    "autoMoodLoggedIn"
  ) === "true"
){

  document
    .getElementById("loginScreen")
    .style.display = "none";

  document
    .getElementById("system")
    .style.display = "block";

}


/* ================= API ================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzNoSKZeYqTSWBNeJeCM1PK90i8Q3Vx0xXEiwMDmoiaKzHxupT92OfzJUAKivP5EqE3Ew/exec";


async function api(
  action,
  data = {}
){

  const url =
    new URL(API_URL);

  url.searchParams.set(
    "action",
    action
  );

  Object.keys(data).forEach(key => {

    url.searchParams.set(
      key,
      data[key]
    );

  });

  const response =
    await fetch(
      url.toString()
    );

  return response.json();

}


/* ================= PAGES ================= */

function openPage(pageId){

  document
    .querySelectorAll(".page")
    .forEach(page => {

      page.classList.remove(
        "active"
      );

    });

  const page =
    document.getElementById(
      pageId
    );

  if(page){

    page.classList.add(
      "active"
    );

  }

  window.scrollTo(0,0);

}


function goHome(){

  openPage("homePage");

  loadDashboard();

}


/* ================= MESSAGE ================= */

function showMessage(
  text,
  type = "success"
){

  const box =
    document.getElementById(
      "message"
    );

  if(!box) return;

  box.innerHTML =
    `<div style="
      padding:12px;
      margin-bottom:15px;
      border-radius:8px;
      background:${
        type === "error"
        ? "#ffe8e8"
        : "#e8f8ee"
      };
      color:${
        type === "error"
        ? "#b00020"
        : "#187a3d"
      };
    ">
      ${text}
    </div>`;

}


/* ================= DASHBOARD ================= */

async function loadDashboard(){

  try{

    const result =
      await api(
        "getDashboard"
      );

    if(!result.success)
      return;

    const data =
      result.data || {};

    document
      .getElementById(
        "invoiceCount"
      )
      .innerText =
        data.invoiceCount || 0;

    document
      .getElementById(
        "salesTotal"
      )
      .innerText =
        data.sales || 0;

    document
      .getElementById(
        "expenseTotal"
      )
      .innerText =
        data.expenses || 0;

    document
      .getElementById(
        "netTotal"
      )
      .innerText =
        data.net || 0;

  }catch(error){

    console.error(error);

  }

}


/* ================= FINISH DAY ================= */

async function finishDay(){

  const confirmed =
    confirm(
      "هل أنت متأكد من إنهاء اليوم؟\n\n" +
      "سيتم إغلاق اليوم الحالي وفتح يوم جديد.\n" +
      "لن يتم حذف الفواتير أو المصروفات القديمة."
    );

  if(!confirmed)
    return;

  try{

    const result =
      await api(
        "finishDay"
      );

    if(result.success){

      alert(
        "تم إنهاء اليوم بنجاح ✅\n" +
        "تم فتح يوم جديد."
      );

      await loadDashboard();

    }else{

      alert(
        result.message ||
        "حدث خطأ"
      );

    }

  }catch(error){

    console.error(error);

    alert(
      "حدث خطأ أثناء إنهاء اليوم"
    );

  }

}

</script>

</body>
</html>
